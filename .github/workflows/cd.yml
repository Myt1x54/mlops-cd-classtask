name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Compute lowercase image name
        id: image
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg GIT_COMMIT=$(git rev-parse --short HEAD) \
            -t ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }} \
            -t ${{ steps.image.outputs.image }}:latest \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
          docker push ${{ steps.image.outputs.image }}:latest

  deploy-staging:
    needs: build
    # Runs on the self-hosted runner installed inside WSL Ubuntu (the deploy box).
    runs-on: self-hosted
    environment:
      name: staging
    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy to staging
        run: |
          docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
          docker stop mlops-api || true
          docker rm mlops-api || true
          docker run -d \
            --name mlops-api \
            --restart unless-stopped \
            -p 5000:5000 \
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Smoke test staging /health
        run: |
          sleep 5
          curl --fail http://localhost:5000/health

  deploy-production:
    needs:
      - build
      - deploy-staging
    runs-on: self-hosted
    environment:
      name: production
    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy to production
        run: |
          docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
          docker stop mlops-api-prod || true
          docker rm mlops-api-prod || true
          docker run -d \
            --name mlops-api-prod \
            --restart unless-stopped \
            -p 5001:5000 \
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Smoke test production /health
        run: |
          sleep 5
          curl --fail http://localhost:5001/health
